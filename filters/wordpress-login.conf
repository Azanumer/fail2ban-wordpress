# /etc/fail2ban/filter.d/wordpress-login.conf
#
# Detects WordPress brute-force login attacks against wp-login.php and
# xmlrpc.php in Nginx and Apache access logs. Installs alongside a jail
# (see jails/wordpress-login.local).
#
# Test against your own log before enabling:
#   fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/wordpress-login.conf

[Definition]

# Nginx: 1.2.3.4 - - [04/Oct/2026:10:00:00 +0500] "POST /wp-login.php HTTP/1.1" 200 1234 "-" "..."
# Apache: 1.2.3.4 - - [04/Oct/2026:10:00:00 +0500] "POST /wp-login.php HTTP/1.1" 200 1234
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(GET|POST) /wp-login\.php(\s|\?)
            ^<HOST> \S+ \S+ \[[^\]]+\] "(GET|POST) /xmlrpc\.php(\s|\?)

# Optional: also catch wp-login POSTs that returned 200 (likely a password guess,
# not a legit session — successful logins normally redirect with 302)
# Uncomment the line below if your log format always includes the status code.
#           ^<HOST> \S+ \S+ \[[^\]]+\] "POST /wp-login\.php[^"]*" 200

ignoreregex =
